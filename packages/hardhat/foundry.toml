[profile.default]
src = "contracts"
test = "foundry/test"
script = "foundry/script"
out = "foundry-out"
cache_path = "foundry-cache"
libs = []
auto_detect_remappings = false
remappings = ["@openzeppelin/=../../node_modules/@openzeppelin/"]
allow_paths = ["../../node_modules"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false
extra_output = ["storageLayout"]
verbosity = 2
gas_reports = ["Core", "Content", "Rewarder", "Minter", "Auction", "Multicall"]
fs_permissions = [{ access = "read-write", path = "./foundry/snapshots" }]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536
failure_persist_dir = "foundry/failures/fuzz"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5000
failure_persist_dir = "foundry/failures/invariant"

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 250
depth = 50

[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 128
